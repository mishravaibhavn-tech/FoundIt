<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FoundIt — Claims</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <span class="logo sm">Found<span>It</span></span>
  <div class="navlinks">
    <a href="dashboard.html">Browse</a>
    <a href="report.html">Report item</a>
    <a href="claims.html" class="on">My claims</a>
    <a href="#" id="logout">Logout</a>
  </div>
</nav>

<main class="wrap">
  <h2>Claims on my items</h2>
  <div id="incoming"></div>

  <h2 style="margin-top:34px">Claims I made</h2>
  <div id="mine"></div>
</main>

<script src="js/app.js"></script>
<script>
  requireLogin();

  async function load(){

    const inc = await get('claims', {action:'incoming'});
    incoming.innerHTML = inc.claims.length ? ''
      : '<p class="muted">No one has claimed your items yet.</p>';

    inc.claims.forEach(c => {
      const d = document.createElement('div');
      d.className = 'row';
      d.innerHTML =
        `<div><strong>${escapeHtml(c.title)}</strong>
         <div class="muted">${escapeHtml(c.claimant)} answered:</div>
         <div class="qbox">${escapeHtml(c.answer)}</div></div>
         <div class="actions">${
           c.status === 'PENDING'
             ? `<button class="btn slim ok"  data-id="${c.claimId}" data-v="APPROVED">Approve</button>
                <button class="btn slim bad" data-id="${c.claimId}" data-v="REJECTED">Reject</button>`
             : `<span class="pill status">${c.status}</span>`}</div>`;
      incoming.appendChild(d);
    });

    incoming.querySelectorAll('button[data-id]').forEach(b => {
      b.onclick = async () => {
        await post('claims', {action:'decide', claimId:b.dataset.id, verdict:b.dataset.v});
        load();
      };
    });

    const my = await get('claims', {});
    mine.innerHTML = my.claims.length ? ''
      : '<p class="muted">You have not claimed anything.</p>';

    my.claims.forEach(c => {
      const d = document.createElement('div');
      d.className = 'row';
      d.innerHTML =
        `<div><strong>${escapeHtml(c.title)}</strong>
         <div class="muted">You answered: ${escapeHtml(c.answer)}</div></div>
         <div class="actions"><span class="pill status">${c.status}</span>${
           c.status === 'APPROVED'
             ? '<div class="hint">Collect from the college help desk.</div>' : ''}</div>`;
      mine.appendChild(d);
    });
  }

  load();
</script>
</body>
</html>
